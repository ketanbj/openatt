name: Verify experimental modality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ketanbj/open-modality-trust
          ref: 6d62086848c0bfefd4c23cade252249670b21110
          path: _shared
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e _shared/core -e '.[benchmark]' pytest ruff build
      - run: ruff check src tests scripts examples
      - run: ruff format --check src tests scripts examples
      - run: pytest -q
      - run: python -m openatt demo --output output/ci-demo
      - run: python scripts/benchmark.py --trials 2 --output output/ci-benchmark.json
      - run: python scripts/verify_evidence.py
      - run: python -m build
      - name: Verify installed wheel outside source checkout
        shell: bash
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          MODALITY_SMOKE_DIR=$(mktemp -d)
          cd "$MODALITY_SMOKE_DIR"
          python -m openatt demo --output demo
