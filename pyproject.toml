[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "openatt"
version = "0.1.0"
readme = "README.md"
license-files = ["LICENSE"]
description = "Experimental challenge-bound controller reports for tactile agent interactions"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["open-modality-trust-core==0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.14,<1", "build>=1.3,<2"]
benchmark = ["matplotlib>=3.9,<4"]

[project.scripts]
openatt = "openatt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
